<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Judge the Model</title>
  <style>
    :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #5f5f66; --line: #d9d9de; --accent: #2457b8; --card: #f4f4f7; --warn: #8a4b00; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151517; --fg: #ececef; --muted: #a8a8b0; --line: #36363c; --accent: #8ab4ff; --card: #1f1f23; --warn: #f0b562; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    header, main { max-width: 960px; margin: 0 auto; padding: 16px; }
    h1 { margin: 0 0 8px; }
    nav a { margin-right: 16px; color: var(--accent); }
    nav a[aria-current="page"] { font-weight: 700; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
    select { font: inherit; padding: 4px 6px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    caption { text-align: left; font-weight: 600; padding-bottom: 4px; }
    td, th { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .partition { display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 8px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); }
    .note { color: var(--muted); font-size: 14px; }
    .starter { background: var(--card); border: 1px dashed var(--line); padding: 8px 12px; border-radius: 8px; }
    .recs { background: var(--card); border-left: 4px solid var(--accent); padding: 8px 12px; border-radius: 8px; margin: 8px 0; }
    .recs ul { margin: 4px 0; padding-left: 20px; }
    .missing { color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <h1>Judge the Model</h1>
    <p class="note">Which classifier would you trust for this job, at what threshold, and with what limits?</p>
    <section class="recs" aria-labelledby="recs-title">
      <h2 id="recs-title" style="font-size:1.1rem;margin:0">Recommendations</h2>
      <div id="recs"></div>
    </section>
    <nav aria-label="Sections">
      <a href="#beyond-accuracy">1. Beyond Accuracy</a>
      <a href="#threshold">2. A Threshold for the Job</a>
      <a href="#ranking">3. Ranking vs. Being Right</a>
      <a href="#fair-comparison">4. A Fair Comparison</a>
    </nav>
    <div class="controls">
      <label>Dataset <select id="dataset"></select></label>
      <label>Model <select id="model"></select></label>
    </div>
  </header>
  <main id="section" tabindex="-1"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
